---
jobs:
  deploy_onlyweb:
    name: Deploy @onlyweb/dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: onlyweb
          entrypoint: main.js
          root: .examples/onlyweb.dev
